name: Verify (uncached)

on:
  workflow_dispatch:
  schedule:
    # 毎日 18:00 UTC (JST 03:00) に uncached 検証を実行
    - cron: '0 18 * * *'

permissions: read-all

concurrency:
  group: verify-uncached-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-uncached:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v4.2.2
      - uses: ./.github/actions/nix-setup
      - name: Start local Turso
        env:
          TURSO_CI_DB_FILE: /tmp/tech-clip-ci-turso.db
          TURSO_CI_PORT: "8888"
        run: nix develop .#ci --command bash scripts/ci/start-turso.sh
      - name: Uncached typecheck + test
        env:
          TECH_CLIP_REQUIRE_LOCAL_TURSO: "1"
          SQLD_URL: http://127.0.0.1:8888
          SQLD_AUTH_TOKEN: dummy
        run: nix develop .#ci --command pnpm verify:uncached
