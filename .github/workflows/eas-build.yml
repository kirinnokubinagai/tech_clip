name: EAS Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        description: EAS build profile
        required: true
        type: choice
        options: [preview, production]
        default: preview

permissions: read-all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  EXPO_PUBLIC_API_URL: https://api.techclip.app
  EXPO_PUBLIC_API_URL_IOS: https://api.techclip.app
  EXPO_PUBLIC_API_URL_ANDROID: https://api.techclip.app

jobs:
  build-ios:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare OTA signing certificate
        env:
          OTA_UPDATE_CERTIFICATE: ${{ secrets.OTA_UPDATE_CERTIFICATE }}
          OTA_UPDATE_PRIVATE_KEY: ${{ secrets.OTA_UPDATE_PRIVATE_KEY }}
        run: scripts/ci/prepare-ota-signing-certificate.sh apps/mobile/certs
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "${EXPO_TOKEN:-}" || -z "${EXPO_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::EXPO_TOKEN is not configured; refusing to report a false-green EAS build."
            exit 1
          fi
      - uses: expo/expo-github-action@v9
        with:
          eas-version: "14.x"
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify EAS CLI and authentication
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: ../../scripts/ci/run-eas.sh whoami
      - name: Build iOS and verify artifact
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
        run: |
          set -euo pipefail
          profile="${APP_ENV}"
          if [[ "$profile" == "production" ]]; then
            for name in ADMOB_ANDROID_APP_ID ADMOB_IOS_APP_ID; do
              if [[ -z "${!name:-}" || -z "${!name//[[:space:]]/}" ]]; then
                echo "::error::$name is required for a production build; refusing to ship test AdMob IDs."
                exit 1
              fi
            done
          fi
          mkdir -p "$RUNNER_TEMP/techclip-eas"
          output="$RUNNER_TEMP/techclip-eas/${profile}-ios.json"
          ../../scripts/ci/run-eas.sh build \
            --platform ios \
            --profile "$profile" \
            --non-interactive \
            --wait \
            --build-logger-level debug \
            --json > "$output"
          python3 ../../scripts/ci/verify-eas-build-json.py "$output" ios

  build-android:
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare OTA signing certificate
        env:
          OTA_UPDATE_CERTIFICATE: ${{ secrets.OTA_UPDATE_CERTIFICATE }}
          OTA_UPDATE_PRIVATE_KEY: ${{ secrets.OTA_UPDATE_PRIVATE_KEY }}
        run: scripts/ci/prepare-ota-signing-certificate.sh apps/mobile/certs
      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "${EXPO_TOKEN:-}" || -z "${EXPO_TOKEN//[[:space:]]/}" ]]; then
            echo "::error::EXPO_TOKEN is not configured; refusing to report a false-green EAS build."
            exit 1
          fi
      - uses: expo/expo-github-action@v9
        with:
          eas-version: "14.x"
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Verify EAS CLI and authentication
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: ../../scripts/ci/run-eas.sh whoami
      - name: Build Android and verify artifact
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 'production' }}
          ADMOB_ANDROID_APP_ID: ${{ vars.ADMOB_ANDROID_APP_ID }}
          ADMOB_IOS_APP_ID: ${{ vars.ADMOB_IOS_APP_ID }}
        run: |
          set -euo pipefail
          profile="${APP_ENV}"
          if [[ "$profile" == "production" ]]; then
            for name in ADMOB_ANDROID_APP_ID ADMOB_IOS_APP_ID; do
              if [[ -z "${!name:-}" || -z "${!name//[[:space:]]/}" ]]; then
                echo "::error::$name is required for a production build; refusing to ship test AdMob IDs."
                exit 1
              fi
            done
          fi
          mkdir -p "$RUNNER_TEMP/techclip-eas"
          output="$RUNNER_TEMP/techclip-eas/${profile}-android.json"
          ../../scripts/ci/run-eas.sh build \
            --platform android \
            --profile "$profile" \
            --non-interactive \
            --wait \
            --build-logger-level debug \
            --json > "$output"
          python3 ../../scripts/ci/verify-eas-build-json.py "$output" android
